<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>請求書プレビュー</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 16px; font-family: "Yu Gothic", "Meiryo", sans-serif; font-size: 13px; color: #1f2937; background: #eef0f2; }
    .page { max-width: 1480px; margin: 0 auto; padding: 30px 34px 38px; border: 1px solid #d1d5db; background: #fff; }
    .title { margin: 2px 0 26px; text-align: center; font-size: 30px; font-weight: 800; letter-spacing: .45em; }
    .summary { display: grid; grid-template-columns: minmax(260px,1.6fr) minmax(190px,.8fr) minmax(230px,1fr) minmax(190px,.8fr); border-top: 1px solid #cbd5e1; border-left: 1px solid #cbd5e1; }
    .summary-item { min-width: 0; padding: 12px 14px; border-right: 1px solid #cbd5e1; border-bottom: 1px solid #cbd5e1; }
    .summary-label { margin-bottom: 5px; color: #64748b; font-size: 11px; font-weight: 700; }
    .summary-value { font-size: 15px; font-weight: 700; }
    .summary-value.amount { color: #1d4ed8; font-size: 22px; font-variant-numeric: tabular-nums; }
    .section-title { margin: 24px 0 10px; padding-left: 9px; border-left: 4px solid #334155; font-size: 16px; font-weight: 700; }
    .table-wrapper { overflow-x: auto; border: 1px solid #cbd5e1; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    .detail-table { min-width: 1920px; }
    th, td { padding: 7px 8px; border-right: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
    th:last-child, td:last-child { border-right: none; }
    thead th { position: sticky; top: 0; z-index: 2; text-align: center; background: #e2e8f0; }
    tbody tr:nth-child(even) { background: #f8fafc; }
    tbody tr:hover { background: #eff6ff; }
    .center { text-align: center; }
    .number { text-align: right; font-variant-numeric: tabular-nums; }
    .line-total { font-weight: 700; }
    .totals { width: min(520px,100%); margin: 18px 0 0 auto; border-top: 1px solid #cbd5e1; border-left: 1px solid #cbd5e1; }
    .totals th { width: 60%; text-align: left; background: #f1f5f9; }
    .totals td { text-align: right; font-variant-numeric: tabular-nums; }
    .totals .grand-total th, .totals .grand-total td { color: #1d4ed8; font-size: 17px; font-weight: 800; }
    .empty { padding: 40px; text-align: center; color: #94a3b8; }
    @media (max-width: 900px) { .page { padding: 22px 18px 28px; } .summary { grid-template-columns: 1fr 1fr; } }
    @media print { body { margin: 0; background: #fff; } .page { max-width: none; padding: 8mm; border: none; } .table-wrapper { overflow: visible; } }
  </style>
</head>
<body>
  <div class="page">
    <h1 class="title">請 求 書</h1>
    <div th:if="${rows != null && !rows.isEmpty()}">
      <section class="summary">
        <div class="summary-item">
          <div class="summary-label">顧客名</div>
          <div class="summary-value" th:text="${rows[0]['customer_name']} + '　御中'">株式会社○○　御中</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">対象月</div>
          <div class="summary-value" th:text="${rows[0]['target_month'] != null ? #strings.replace(rows[0]['target_month'], '-', '年') + '月' : ''}"></div>
        </div>
        <div class="summary-item">
          <div class="summary-label">集計期間</div>
          <div class="summary-value" th:text="${rows[0]['period_start'] != null and rows[0]['period_end'] != null ? #dates.format(rows[0]['period_start'], 'yyyy年M月d日') + ' ～ ' + #dates.format(rows[0]['period_end'], 'yyyy年M月d日') : ''}"></div>
        </div>
        <div class="summary-item">
          <div class="summary-label">発行日</div>
          <div class="summary-value" th:text="${rows[0]['invoice_date'] != null ? #dates.format(rows[0]['invoice_date'], 'yyyy年M月d日') : ''}"></div>
        </div>
        <div class="summary-item" style="grid-column: 1 / -1">
          <div class="summary-label">ご請求金額</div>
          <div class="summary-value amount" th:text="'￥' + ${#numbers.formatInteger(rows[0]['total_amount'] != null ? rows[0]['total_amount'] : 0, 1, 'COMMA')}">￥0</div>
        </div>
      </section>

      <h2 class="section-title">請求明細（日報単位）</h2>
      <div class="table-wrapper">
        <table class="detail-table">
          <thead>
            <tr>
              <th>No</th><th>勤務日</th><th>現場</th><th>職種</th><th>役職</th>
              <th>社員コード</th><th>氏名</th><th>請求単位</th><th>通常数量</th>
              <th>残業時間</th><th>深夜時間</th><th>通勤距離</th><th>基本金額</th>
              <th>残業金額</th><th>深夜金額</th><th>通勤金額</th><th>その他金額</th><th>小計</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="row, stat : ${rows}">
              <td class="center" th:text="${stat.count}">1</td>
              <td class="center" th:text="${row['work_date'] != null ? #dates.format(row['work_date'], 'yyyy年M月d日') : ''}"></td>
              <td th:text="${row['site_name'] != null ? row['site_name'] : ''}"></td>
              <td th:text="${row['job_name'] != null and row['job_name'] != '' ? row['job_name'] : row['job_code']}"></td>
              <td th:text="${row['site_role_name'] != null and row['site_role_name'] != '' ? row['site_role_name'] : row['site_role_code']}"></td>
              <td th:text="${row['employee_code'] != null ? row['employee_code'] : ''}"></td>
              <td th:text="${row['employee_name'] != null ? row['employee_name'] : ''}"></td>
              <td class="center" th:text="${row['billing_unit'] == 'DAILY' ? '日額' : row['billing_unit'] == 'HOURLY' ? '時間額' : row['billing_unit'] == 'MONTHLY' ? '月額' : (row['billing_unit'] != null ? row['billing_unit'] : '')}"></td>
              <td class="number" th:text="${#numbers.formatDecimal(row['billing_quantity'] != null ? row['billing_quantity'] : 0, 1, 2)} + ${row['billing_unit'] == 'HOURLY' ? '時間' : row['billing_unit'] == 'MONTHLY' ? '月' : '人'}"></td>
              <td class="number" th:text="${#numbers.formatDecimal(row['overtime_hours'] != null ? row['overtime_hours'] : 0, 1, 2)} + '時間'"></td>
              <td class="number" th:text="${#numbers.formatDecimal(row['night_work_hours'] != null ? row['night_work_hours'] : 0, 1, 2)} + '時間'"></td>
              <td class="number" th:text="${#numbers.formatDecimal(row['mileage'] != null ? row['mileage'] : 0, 1, 2)} + 'km'"></td>
              <td class="number" th:text="${#numbers.formatInteger(row['base_amount'] != null ? row['base_amount'] : 0, 1, 'COMMA')} + '円'"></td>
              <td class="number" th:text="${#numbers.formatInteger(row['overtime_amount'] != null ? row['overtime_amount'] : 0, 1, 'COMMA')} + '円'"></td>
              <td class="number" th:text="${#numbers.formatInteger(row['night_amount'] != null ? row['night_amount'] : 0, 1, 'COMMA')} + '円'"></td>
              <td class="number" th:text="${#numbers.formatInteger(row['commute_amount'] != null ? row['commute_amount'] : 0, 1, 'COMMA')} + '円'"></td>
              <td class="number" th:text="${#numbers.formatInteger(row['other_amount'] != null ? row['other_amount'] : 0, 1, 'COMMA')} + '円'"></td>
              <td class="number line-total" th:text="${#numbers.formatInteger(row['line_amount'] != null ? row['line_amount'] : 0, 1, 'COMMA')} + '円'"></td>
            </tr>
          </tbody>
        </table>
      </div>

      <table class="totals">
        <tbody>
          <tr><th>小計（税抜）</th><td th:text="${#numbers.formatInteger(rows[0]['subtotal_amount'] != null ? rows[0]['subtotal_amount'] : 0, 1, 'COMMA')} + '円'"></td></tr>
          <tr><th>消費税（10.0％）</th><td th:text="${#numbers.formatInteger(rows[0]['tax_amount'] != null ? rows[0]['tax_amount'] : 0, 1, 'COMMA')} + '円'"></td></tr>
          <tr class="grand-total"><th>ご請求金額</th><td th:text="${#numbers.formatInteger(rows[0]['total_amount'] != null ? rows[0]['total_amount'] : 0, 1, 'COMMA')} + '円'"></td></tr>
        </tbody>
      </table>
    </div>
    <div class="empty" th:if="${rows == null || rows.isEmpty()}">表示する請求データがありません。</div>
  </div>
</body>
</html>
