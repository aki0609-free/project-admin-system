<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>日次給与明細プレビュー</title>
<style>
body {
    margin: 0;
    padding: 24px;
    font-family: "Yu Gothic", "Meiryo", sans-serif;
    font-size: 13px;
    color: #111827;
    background: #f3f4f6;
}
.page { max-width: 980px; margin: 0 auto; }
.notice {
    margin-bottom: 12px;
    padding: 10px 14px;
    color: #475569;
    background: #e2e8f0;
    border-radius: 6px;
}
.empty {
    padding: 48px 20px;
    text-align: center;
    color: #64748b;
    background: #fff;
    border: 1px dashed #94a3b8;
    border-radius: 8px;
}
.slip {
    margin-bottom: 22px;
    padding: 18px 20px;
    background: #fff;
    border: 1px solid #111827;
    border-radius: 8px;
    page-break-inside: avoid;
}
.header {
    display: grid;
    grid-template-columns: 1fr 220px 220px;
    gap: 12px;
    align-items: center;
    padding-bottom: 8px;
    margin-bottom: 12px;
    border-bottom: 3px solid #111827;
}
.title { font-size: 20px; font-weight: 900; letter-spacing: .12em; }
.head-box { font-weight: 800; }
.right { text-align: right; }
.section-title {
    margin-top: 10px;
    padding: 5px 8px;
    color: #fff;
    background: #111827;
    font-weight: 900;
}
.row, .items {
    display: grid;
    grid-template-columns: 130px 1fr 130px 1fr;
    border-top: 1px solid #d1d5db;
    border-left: 1px solid #d1d5db;
}
.cell-label, .cell-value, .item-name, .item-value {
    min-height: 25px;
    padding: 6px 8px;
    border-right: 1px solid #d1d5db;
    border-bottom: 1px solid #d1d5db;
}
.cell-label { background: #f3f4f6; font-weight: 800; }
.item-name { background: #f9fafb; font-weight: 700; }
.money, .item-value { text-align: right; font-variant-numeric: tabular-nums; }
.total {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    margin-top: 12px;
    border: 2px solid #111827;
}
.total-box { border-right: 1px solid #111827; }
.total-box:last-child { border-right: 0; }
.total-label { padding: 6px 8px; text-align: center; background: #e5e7eb; font-weight: 900; }
.total-value { padding: 8px; text-align: right; font-size: 17px; font-weight: 900; }
.note { min-height: 40px; padding: 8px; border: 1px solid #d1d5db; }
@media print {
    body { padding: 0; background: #fff; }
    .page { max-width: none; }
    .notice { display: none; }
    .slip { margin-bottom: 10px; border-radius: 0; }
}
</style>
</head>
<body>
<main class="page">
    <div class="notice">データ確認用プレビューです。本印刷ではJasperReportsのPDFレイアウトを使用します。</div>

    <div class="empty" th:if="${#lists.isEmpty(rows)}">
        対象日に日次給与明細のデータがありません。
    </div>

    <section class="slip" th:each="row : ${rows}">
        <div class="header">
            <div class="title">日次給与明細</div>
            <div class="head-box">
                <span th:text="${row['employee_code'] ?: ''}"></span>
                <span th:text="${row['employee_name'] ?: ''}"></span>
            </div>
            <div class="head-box right">
                支払日：<span th:text="${row['payment_date'] ?: ''}"></span>
            </div>
        </div>

        <div class="row">
            <div class="cell-label">労務期間</div>
            <div class="cell-value">
                <span th:text="${row['labor_period_from'] ?: ''}"></span>
                ～
                <span th:text="${row['labor_period_to'] ?: ''}"></span>
            </div>
            <div class="cell-label">勤務時間</div>
            <div class="cell-value right" th:text="${row['work_hours'] ?: 0} + ' h'"></div>
        </div>
        <div class="row">
            <div class="cell-label">時間外</div>
            <div class="cell-value right" th:text="${row['overtime_hours'] ?: 0} + ' h'"></div>
            <div class="cell-label">深夜</div>
            <div class="cell-value right" th:text="${row['night_work_hours'] ?: 0} + ' h'"></div>
        </div>

        <div class="section-title">手当</div>
        <div class="items">
            <th:block th:each="i : ${#numbers.sequence(1,10)}">
                <div class="item-name" th:text="${row['allowance_item_name' + i] ?: ''}"></div>
                <div class="item-value"
                     th:text="${row['allowance_item_value' + i] == null ? '' : #numbers.formatDecimal(row['allowance_item_value' + i], 0, 'COMMA', 0, 'POINT') + ' 円'}"></div>
            </th:block>
        </div>

        <div class="section-title">控除</div>
        <div class="items">
            <th:block th:each="i : ${#numbers.sequence(1,10)}">
                <div class="item-name" th:text="${row['deduction_item_name' + i] ?: ''}"></div>
                <div class="item-value"
                     th:text="${row['deduction_item_value' + i] == null ? '' : #numbers.formatDecimal(row['deduction_item_value' + i], 0, 'COMMA', 0, 'POINT') + ' 円'}"></div>
            </th:block>
        </div>

        <div class="total">
            <div class="total-box">
                <div class="total-label">基本給</div>
                <div class="total-value" th:text="${#numbers.formatDecimal(row['basic_salary'] ?: 0, 0, 'COMMA', 0, 'POINT')} + ' 円'"></div>
            </div>
            <div class="total-box">
                <div class="total-label">総支給額</div>
                <div class="total-value" th:text="${#numbers.formatDecimal(row['gross_amount'] ?: 0, 0, 'COMMA', 0, 'POINT')} + ' 円'"></div>
            </div>
            <div class="total-box">
                <div class="total-label">控除合計</div>
                <div class="total-value" th:text="${#numbers.formatDecimal(row['deduction_total'] ?: 0, 0, 'COMMA', 0, 'POINT')} + ' 円'"></div>
            </div>
            <div class="total-box">
                <div class="total-label">実支払額</div>
                <div class="total-value" th:text="${#numbers.formatDecimal(row['net_payment_amount'] ?: 0, 0, 'COMMA', 0, 'POINT')} + ' 円'"></div>
            </div>
        </div>

        <div class="section-title">備考</div>
        <div class="note" th:text="${row['note'] ?: ''}"></div>
    </section>
</main>
</body>
</html>
